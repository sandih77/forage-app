<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${demande.id != 0} ? 'Éditer la demande — GestioPro' : 'Nouvelle demande — GestioPro'">Demande —
        GestioPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/app.css}">
</head>

<body>

    <nav th:replace="~{fragments/layout :: navbar('demande')}"></nav>

    <main class="page-wrapper">
        <div class="page-container" style="max-width: 720px;">

            <div class="page-header fade-up">
                <div class="page-header-left">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/}">Accueil</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/demande/list}">Demandes</a></li>
                            <li class="breadcrumb-item active" th:text="${demande.id != 0} ? 'Éditer' : 'Nouvelle'">
                                Formulaire</li>
                        </ol>
                    </nav>
                    <h1 class="page-title" th:text="${demande.id != 0} ? 'Éditer la demande' : 'Nouvelle demande'">
                        Demande
                    </h1>
                    <p class="page-subtitle"
                        th:text="${demande.id != 0} ? 'Modifiez les informations de la demande' : 'Renseignez les informations de la nouvelle demande'">
                    </p>
                </div>
            </div>

            <div class="card fade-up fade-up-1">
                <div class="card-header">
                    <span class="card-header-title">
                        <i class="bi bi-inbox"></i>
                        <span
                            th:text="${demande.id != 0} ? 'Modification #' + ${demande.id} : 'Informations de la demande'"></span>
                    </span>
                </div>
                <div class="card-body">
                    <form th:action="${demande.id != 0} ? @{/demande/edit} : @{/demande/save}" th:object="${demande}"
                        method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="row g-4">

                            <div class="col-md-6">
                                <label for="client" class="form-label">Client</label>
                                <select id="client" th:field="*{client}" class="form-select">
                                    <option value="">— Sélectionner un client —</option>
                                    <option th:each="client : ${clients}" th:value="${client.id}"
                                        th:text="${client.nom}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="commune" class="form-label">Commune</label>
                                <select id="commune" th:field="*{commune}" class="form-select">
                                    <option value="">— Sélectionner une commune —</option>
                                    <option th:each="commune : ${communes}" th:value="${commune.id}"
                                        th:text="${commune.nom}">
                                    </option>
                                </select>
                            </div>

                            <!-- Lieu -->
                            <div class="col-md-6">
                                <label for="lieu" class="form-label">Lieu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                                    <input type="text" id="lieu" th:field="*{lieu}" class="form-control"
                                        placeholder="Adresse ou lieu" />
                                </div>
                            </div>

                            <!-- Référence -->
                            <div class="col-md-6">
                                <label for="reference" class="form-label">Référence</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-hash"></i></span>
                                    <input type="text" id="reference" th:field="*{reference}" class="form-control"
                                        placeholder="Ex: DEMANDE01" />
                                </div>
                            </div>

                        </div>

                        <hr class="divider">

                        <!-- Actions -->
                        <div class="d-flex gap-3 justify-content-end">
                            <a th:href="@{/demande/list}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Annuler
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i th:class="${demande.id != 0} ? 'bi bi-check-circle' : 'bi bi-plus-circle'"></i>
                                <span
                                    th:text="${demande.id != 0} ? 'Enregistrer les modifications' : 'Créer la demande'"></span>
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
