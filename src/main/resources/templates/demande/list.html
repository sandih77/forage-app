<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Demandes — ForageApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/app.css}">
</head>

<body>

    <nav th:replace="~{fragments/layout :: navbar('demande')}"></nav>

    <main class="page-wrapper">
        <div class="page-container">

            <div class="page-header fade-up">
                <div class="page-header-left">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/}">Accueil</a></li>
                            <li class="breadcrumb-item active">Demandes</li>
                        </ol>
                    </nav>
                    <h1 class="page-title">Demandes</h1>
                    <p class="page-subtitle">Gérez et suivez toutes les demandes clients</p>
                </div>
                <a th:href="@{/demande/showForm}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nouvelle demande
                </a>
            </div>

            <div class="card fade-up fade-up-1">

                <form th:action="@{/demande/search}" method="get" class="search-bar">
                    <div class="form-group">
                        <label class="form-label">Client</label>
                        <input type="text" name="client" class="form-control" placeholder="Nom du client..."
                            th:value="${param.client}" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Commune</label>
                        <select name="communeId" class="form-select">
                            <option value="">Toutes les communes</option>
                            <option th:each="commune : ${communes}" th:value="${commune.id}" th:text="${commune.nom}"
                                th:selected="${param.communeId != null and param.communeId[0] == commune.id.toString()}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Lieu</label>
                        <input type="text" name="lieu" class="form-control" placeholder="Lieu..."
                            th:value="${param.lieu}" />
                    </div>
                    <div class="form-group" style="flex: 0;">
                        <label class="form-label">&nbsp;</label>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-search"></i> Rechercher
                        </button>
                    </div>
                </form>

                <div class="table-responsive table-wrapper">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Client</th>
                                <th>Commune</th>
                                <th>Lieu</th>
                                <th>Référence</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(demandes)}">
                                <td colspan="6">
                                    <div class="empty-state">
                                        <i class="bi bi-inbox"></i>
                                        <p>Aucune demande trouvée</p>
                                        <a th:href="@{/demande/showForm}" class="btn btn-outline-accent btn-sm">
                                            <i class="bi bi-plus-circle"></i> Créer une demande
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:each="demande : ${demandes}">
                                <td><span class="badge-id" th:text="${demande.id}"></span></td>
                                <td>
                                    <span th:if="${demande.client != null}" th:text="${demande.client.nom}"></span>
                                    <span th:if="${demande.client == null}" class="badge-empty">Aucun client</span>
                                </td>
                                <td>
                                    <span th:if="${demande.commune != null}" th:text="${demande.commune.nom}"></span>
                                    <span th:if="${demande.commune == null}" class="badge-empty">Non renseignée</span>
                                </td>
                                <td th:text="${demande.lieu}"></td>
                                <td><span class="badge-ref" th:text="${demande.reference}"></span></td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <a th:href="@{/demande/edit/{id}(id=${demande.id})}"
                                            class="btn btn-secondary btn-sm">
                                            <i class="bi bi-pencil"></i> Éditer
                                        </a>
                                        <a th:href="@{/demande/delete/{id}(id=${demande.id})}"
                                            class="btn btn-danger btn-sm"
                                            onclick="return confirm('Confirmer la suppression ?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
