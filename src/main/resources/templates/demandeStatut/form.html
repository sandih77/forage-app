<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer le statut — GestioPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/app.css}">
    <style>
        /* Autocomplete wrapper needs position:relative */
        .autocomplete-wrapper {
            position: relative;
        }
    </style>
</head>

<body>

    <nav th:replace="~{fragments/layout :: navbar('demandeStatut')}"></nav>

    <main class="page-wrapper">
        <div class="page-container" style="max-width: 720px;">

            <div class="page-header fade-up">
                <div class="page-header-left">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/}">Accueil</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/demandeStatut/list}">Statuts</a></li>
                            <li class="breadcrumb-item active">Changer le statut</li>
                        </ol>
                    </nav>
                    <h1 class="page-title">Changer le statut</h1>
                    <p class="page-subtitle">Associez un nouveau statut à une demande existante</p>
                </div>
            </div>

            <div class="card fade-up fade-up-1">
                <div class="card-header">
                    <span class="card-header-title">
                        <i class="bi bi-activity"></i> Informations du statut
                    </span>
                </div>
                <div class="card-body">
                    <form th:action="@{/demandeStatut/save}" th:object="${demandeStatut}" method="post">

                        <div class="row g-4">

                            <div class="col-12">
                                <label for="referenceInput" class="form-label">Référence de la demande</label>
                                <div class="autocomplete-wrapper">
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                                        <input type="text" id="referenceInput" class="form-control"
                                            th:data-url="@{/demandeStatut/findDemande}" placeholder="Ex: DEMANDE01"
                                            autocomplete="off" />
                                    </div>
                                    <div id="autocompleteList" class="autocomplete-list" style="display:none;"></div>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Demande sélectionnée</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-inbox"></i></span>
                                    <input type="text" id="demandeLibelle" class="form-control" readonly
                                        placeholder="La demande apparaîtra ici…" />
                                </div>
                                <input type="hidden" th:field="*{demande}" id="demandeId">
                            </div>

                            <div class="col-md-6">
                                <label for="statut" class="form-label">Statut</label>
                                <select th:field="*{statut}" id="statut" class="form-select">
                                    <option value="">— Choisir un statut —</option>
                                    <option th:each="s : ${statuts}" th:value="${s.id}" th:text="${s.libelle}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="date" class="form-label">Date &amp; heure</label>
                                <input type="datetime-local" th:field="*{dateStatut}" id="date" class="form-control" />
                            </div>

                            <div class="col-12">
                                <label for="observation" class="form-label">Observation</label>
                                <textarea th:field="*{observation}" id="observation" class="form-control"
                                    placeholder="Remarques, commentaires…"></textarea>
                            </div>

                        </div>

                        <hr class="divider">

                        <!-- Actions -->
                        <div class="d-flex gap-3 justify-content-end">
                            <a th:href="@{/demandeStatut/list}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Annuler
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Enregistrer le statut
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/static/js/demandeStatut-form.js}"></script>
</body>

</html>
