<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statuts des Demandes — ForageApp ETU 004174 -Sandih</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/app.css}">
</head>

<body>

    <nav th:replace="~{fragments/layout :: navbar('demandeStatut')}"></nav>

    <main class="page-wrapper">
        <div class="page-container">

            <div class="page-header fade-up">
                <div class="page-header-left">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/}">Accueil</a></li>
                            <li class="breadcrumb-item active">Statuts</li>
                        </ol>
                    </nav>
                    <h1 class="page-title">Statuts des demandes</h1>
                    <p class="page-subtitle">Historique des changements de statut</p>
                </div>
                <a th:href="@{/demandeStatut/showForm}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nouveau statut
                </a>
            </div>

            <div class="card fade-up fade-up-1">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Date</th>
                                <th>Durée travail</th>
                                <th>Observation</th>
                                <th>Demande (réf.)</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(demandeStatuts)}">
                                <td colspan="7">
                                    <div class="empty-state">
                                        <i class="bi bi-activity"></i>
                                        <p>Aucun statut enregistré</p>
                                        <a th:href="@{/demandeStatut/showForm}" class="btn btn-outline-accent btn-sm">
                                            <i class="bi bi-plus-circle"></i> Ajouter un statut
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:each="d : ${demandeStatuts}">
                                <td><span class="badge-id" th:text="${d.id}"></span></td>
                                <td>
                                    <span th:text="${#temporals.format(d.dateStatut, 'dd/MM/yyyy HH:mm')}"
                                        style="font-size:.85rem; color: var(--text-2);"></span>
                                </td>
                                <td>
                                    <span th:if="${d.dureeTravail != null}" style="font-variant-numeric: tabular-nums;"
                                        th:text="${d.dureeTravail}"></span>
                                    <span th:if="${d.dureeTravail == null}" class="badge-empty">—</span>
                                </td>
                                <td>
                                    <span th:if="${d.observation != null and !#strings.isEmpty(d.observation)}"
                                        th:text="${d.observation}" style="font-size:.875rem;"></span>
                                    <span th:if="${d.observation == null or #strings.isEmpty(d.observation)}"
                                        class="badge-empty">—</span>
                                </td>
                                <td><span class="badge-ref" th:text="${d.demande?.reference}"></span></td>
                                <td>
                                    <span class="badge-status"
                                        style="background: rgba(45,212,191,.1); color: var(--accent); border: 1px solid rgba(45,212,191,.25);"
                                        th:text="${d.statut?.libelle}"></span>
                                </td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <a th:href="@{/demandeStatut/edit/{id}(id=${d.id})}"
                                            class="btn btn-secondary btn-sm">
                                            <i class="bi bi-pencil"></i> Éditer
                                        </a>
                                        <a th:href="@{/demandeStatut/delete/{id}(id=${d.id})}"
                                            class="btn btn-danger btn-sm"
                                            onclick="return confirm('Confirmer la suppression ?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
