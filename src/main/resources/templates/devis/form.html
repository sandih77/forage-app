<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devis - Form</title>
    <style>
        .hidden {
            display: none;
        }

        .ligne-devis {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>

<body>

    <form id="searchForm" onsubmit="return false;">
        <input type="text" id="referenceInput" th:data-url="@{/devis/findDemande}" placeholder="Ex: DEMANDE01"
            autocomplete="off" />
    </form>

    <div id="demandeBlock" class="demande hidden">
        <p id="txtLieu"></p>
        <p id="txtReference"></p>
        <p id="txtClient"></p>
        <p id="txtCommune"></p>
    </div>

    <form th:action="@{/devis/save}" method="post" id="mainDevisForm">
        
        <input type="hidden" id="demandeIdInput" name="demande.id" />

        <div id="typeBlock" class="type hidden">
            <select id="typeDevis" name="typeDevis.id"></select>
        </div>

        <div id="lignesContainer"></div>

        <div id="submitBlock" class="hidden" style="margin-top: 15px;">
            <button type="submit" style="background-color: green; color: white; padding: 10px 20px;">
                Enregistrer le devis
            </button>
        </div>

        <div id="addBlock" class="type hidden">
            <button type="button" id="btnAddLigne">Add</button>
        </div>
    </form>

    <template id="ligneDevisTemplate">
        <div class="ligne-devis">
            <input type="text" class="designation" placeholder="Désignation" required />
            <input type="text" class="description" placeholder="Description" />
            <input type="number" class="quantite" placeholder="Qte" min="1" value="1" style="width: 60px;" required />
            <input type="number" class="prixUnitaire" placeholder="P.U" min="0" step="0.01" value="0" style="width: 100px;" required />
            <input type="number" class="input-total total" placeholder="Montant" style="width: 120px;" readonly />
            <button type="button" class="btn-remove" style="color: red;">Remove</button>
        </div>
    </template>

    <script th:src="@{/static/js/devis-form.js}"></script>

</body>

</html>
