<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste des Devis — ForageApp ETU 004174 -Sandih</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/static/css/app.css}">
</head>

<body>

  <nav th:replace="~{fragments/layout :: navbar('devis')}"></nav>

  <main class="page-wrapper">
    <div class="page-container">

      <!-- Page header -->
      <div class="page-header fade-up">
        <div class="page-header-left">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a th:href="@{/}">Accueil</a></li>
              <li class="breadcrumb-item active">Devis</li>
            </ol>
          </nav>
          <h1 class="page-title">Devis</h1>
          <p class="page-subtitle">Gérez tous les devis associés aux demandes</p>
        </div>
        <a th:href="@{/devis/showForm}" class="btn btn-primary">
          <i class="bi bi-plus-circle"></i> Nouveau devis
        </a>
      </div>

      <!-- Card -->
      <div class="card fade-up fade-up-1">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th style="width:8%;">ID</th>
                <th style="width:18%;">Date</th>
                <th style="width:25%;">Réf. Demande</th>
                <th style="width:22%;">Type de devis</th>
                <th style="width:27%;">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(devis)}">
                <td colspan="5">
                  <div class="empty-state">
                    <i class="bi bi-file-text"></i>
                    <p>Aucun devis trouvé</p>
                    <a th:href="@{/devis/showForm}" class="btn btn-outline-accent btn-sm">
                      <i class="bi bi-plus-circle"></i> Créer un devis
                    </a>
                  </div>
                </td>
              </tr>
              <!-- Rows -->
              <tr th:each="d : ${devis}">
                <td><span class="badge-id" th:text="${d.id}"></span></td>
                <td>
                  <span th:text="${#temporals.format(d.dateDevis, 'dd/MM/yyyy HH:mm')}"
                    style="font-size:.85rem; color: var(--text-2);"></span>
                </td>
                <td>
                  <span th:if="${d.demande != null}" class="badge-ref" th:text="${d.demande.reference}"></span>
                  <span th:if="${d.demande == null}" class="badge-empty">Aucune demande</span>
                </td>
                <td th:text="${d.typeDevis?.type} ?: '—'"></td>
                <td>
                  <div class="d-flex gap-2 flex-wrap">
                    <a th:href="@{/devis/edit/{id}(id=${d.id})}" class="btn btn-secondary btn-sm">
                      <i class="bi bi-pencil"></i> Éditer
                    </a>
                    <a th:href="@{/devis/delete/{id}(id=${d.id})}" class="btn btn-danger btn-sm"
                      onclick="return confirm('Supprimer ce devis ?')">
                      <i class="bi bi-trash"></i> Supprimer
                    </a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
